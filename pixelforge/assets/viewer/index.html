<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixelforge viewer</title>
<style>
  :root { --bg: #1b1d23; --panel: #262932; --fg: #e4e4e8; --muted: #9a9cab; --accent: #ff4fa3; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; background: var(--panel); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  select, button { background: #333744; color: var(--fg); border: 1px solid #444858; border-radius: 6px; padding: 4px 8px; font: inherit; }
  button:hover { border-color: var(--accent); }
  main { display: flex; flex-wrap: wrap; gap: 24px; padding: 16px; align-items: flex-start; }
  canvas { image-rendering: pixelated; border-radius: 6px; max-width: 100%; }
  #info { color: var(--muted); font: 12px ui-monospace, monospace; white-space: pre; }
  #strip { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  #strip canvas { cursor: pointer; outline: 2px solid transparent; }
  #strip canvas.on { outline-color: var(--accent); }
  .err { color: #ff8080; padding: 16px; }
</style>
</head>
<body>
<header>
  <h1>pixelforge</h1>
  <label>sprite <select id="sprite"></select></label>
  <label>anim <select id="anim"></select></label>
  <label>zoom <select id="zoom"><option>2</option><option>4</option><option selected>8</option><option>12</option></select></label>
  <label>bg <select id="bg"><option value="check">checker</option><option value="#2a2d36">dark</option><option value="#8fb8de">sky</option><option value="#ffffff">white</option></select></label>
  <button id="play">pause</button>
  <button id="step">step</button>
  <label><input type="checkbox" id="origin" checked> origin</label>
  <label title="Repeat animations that play once in the game (e.g. attack), with a short pause between plays"><input type="checkbox" id="repeat" checked> repeat one-shots</label>
</header>
<main>
  <div>
    <canvas id="stage"></canvas>
    <div id="strip"></div>
  </div>
  <div id="info"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const state = { data: null, img: null, tag: null, frame: 0, playing: true, last: 0, acc: 0 };
const REPEAT_PAUSE_MS = 500;  // gap before a one-shot animation restarts, so its start is visible

async function loadIndex() {
  try {
    const idx = await (await fetch('../export/index.json', { cache: 'no-store' })).json();
    $('sprite').innerHTML = idx.sprites.map((s) => `<option>${s}</option>`).join('');
    const want = new URLSearchParams(location.search).get('sprite');
    if (want) $('sprite').value = want;
    await loadSprite($('sprite').value);
  } catch (e) {
    document.querySelector('main').innerHTML =
      `<p class="err">Could not load ../export/index.json. Run <code>pixelforge export --all</code> ` +
      `then <code>pixelforge serve</code> and open http://127.0.0.1:8000/viewer/</p>`;
  }
}

async function loadSprite(name) {
  const bust = `?t=${Date.now()}`;
  state.data = await (await fetch(`../export/${name}.json${bust}`)).json();
  state.img = new Image();
  state.img.src = `../export/${name}.png${bust}`;
  await state.img.decode();
  const tags = state.data.meta.frameTags;
  $('anim').innerHTML = tags.map((t) => `<option value="${t.name}">${t.name.replace(name + '_', '')}</option>`).join('');
  selectTag(tags[0].name);
}

function selectTag(name) {
  state.tag = state.data.meta.frameTags.find((t) => t.name === name);
  state.frame = 0; state.acc = 0;
  buildStrip();
  draw();
}

const frameAt = (i) => state.data.frames[String(state.tag.from + i)];
const count = () => state.tag.to - state.tag.from + 1;
const loopsInGame = () => state.data.meta.pixelforge?.animations?.[state.tag.name]?.loop ?? true;
const loops = () => loopsInGame() || $('repeat').checked;
// one-shots being repeated get a pause on their last frame
const hold = (i) => frameAt(i).duration + (i === count() - 1 && !loopsInGame() ? REPEAT_PAUSE_MS : 0);

function paintFrame(ctx, f, z, bg) {
  const { w, h } = f.sourceSize;
  ctx.canvas.width = w * z; ctx.canvas.height = h * z;
  if (bg === 'check') {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      ctx.fillStyle = (x + y) % 2 ? '#d6d6d6' : '#ececec';
      ctx.fillRect(x * z, y * z, z, z);
    }
  } else { ctx.fillStyle = bg; ctx.fillRect(0, 0, w * z, h * z); }
  ctx.imageSmoothingEnabled = false;
  const r = f.frame;
  ctx.drawImage(state.img, r.x, r.y, r.w, r.h, 0, 0, w * z, h * z);
}

function draw() {
  const z = +$('zoom').value, f = frameAt(state.frame);
  const ctx = $('stage').getContext('2d');
  paintFrame(ctx, f, z, $('bg').value);
  if ($('origin').checked) {
    const o = state.data.meta.pixelforge?.origin ?? [f.sourceSize.w / 2, f.sourceSize.h];
    ctx.strokeStyle = '#ff00c8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, o[1] * z - 1); ctx.lineTo(f.sourceSize.w * z, o[1] * z - 1);
    ctx.moveTo(o[0] * z, (o[1] - 3) * z); ctx.lineTo(o[0] * z, o[1] * z); ctx.stroke();
  }
  [...$('strip').children].forEach((c, i) => c.classList.toggle('on', i === state.frame));
  const a = state.data.meta.pixelforge?.animations?.[state.tag.name] ?? {};
  $('info').textContent =
    `tag      ${state.tag.name}\nframe    ${state.frame + 1}/${count()}\nduration ${f.duration}ms\n` +
    `fps      ${a.fps ?? '-'}\nin game  ${loopsInGame() ? 'loops' : 'plays once'}\nsheet    x${f.frame.x} y${f.frame.y}`;
}

function buildStrip() {
  $('strip').innerHTML = '';
  for (let i = 0; i < count(); i++) {
    const c = document.createElement('canvas');
    paintFrame(c.getContext('2d'), frameAt(i), 3, $('bg').value);
    c.onclick = () => { state.frame = i; state.playing = false; $('play').textContent = 'play'; draw(); };
    $('strip').appendChild(c);
  }
}

function tick(t) {
  if (state.tag && state.playing) {
    state.acc += t - (state.last || t);
    while (state.acc >= hold(state.frame)) {
      state.acc -= hold(state.frame);
      if (state.frame === count() - 1 && !loops()) { state.acc = 0; break; }
      state.frame = (state.frame + 1) % count();
      draw();
    }
  }
  state.last = t;
  requestAnimationFrame(tick);
}

$('sprite').onchange = (e) => loadSprite(e.target.value);
$('anim').onchange = (e) => selectTag(e.target.value);
$('zoom').onchange = draw;
$('bg').onchange = () => { buildStrip(); draw(); };
$('origin').onchange = draw;
$('repeat').onchange = draw;
$('play').onclick = () => {
  state.playing = !state.playing;
  if (state.playing && state.frame === count() - 1 && !loops()) state.frame = 0;
  $('play').textContent = state.playing ? 'pause' : 'play';
};
$('step').onclick = () => { state.playing = false; $('play').textContent = 'play'; state.frame = (state.frame + 1) % count(); draw(); };
loadIndex();
requestAnimationFrame(tick);
</script>
</body>
</html>
