<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixelforge sprites</title>
<style>
  :root { --bg: #1b1d23; --panel: #23262e; --card: #2a2d36; --line: #3a3e4c; --fg: #e4e4e8; --muted: #9a9cab;
          --accent: #ff4fa3; --hit: #f0283c; --hurt: #28c85a; --body: #fac828; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }
  .layout { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
  nav { background: var(--panel); border-right: 1px solid var(--line); padding: 14px 10px; position: sticky; top: 0;
        height: 100vh; overflow-y: auto; }
  nav .brand { display: block; font-weight: 600; font-size: 15px; padding: 2px 8px 12px; }
  nav .sprite { display: block; padding: 6px 8px; border-radius: 6px; font-weight: 500; }
  nav .anim { display: block; padding: 3px 8px 3px 22px; border-radius: 6px; color: var(--muted); font-size: 13px; }
  nav a:hover { background: #2f3340; }
  nav a.on { background: #3a2433; color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
  nav .tools { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 10px; }
  nav .tools a { display: block; padding: 4px 8px; color: var(--muted); font-size: 13px; border-radius: 6px; }
  main { padding: 18px 24px 40px; min-width: 0; }
  .crumbs { color: var(--muted); margin-bottom: 4px; font-size: 13px; }
  .crumbs a:hover { color: var(--fg); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex;
          flex-direction: column; align-items: center; gap: 8px; transition: border-color .15s; }
  .card:hover { border-color: var(--accent); }
  .card .name { font-weight: 600; }
  .card .meta { color: var(--muted); font-size: 12px; text-align: center; }
  canvas { image-rendering: pixelated; display: block; max-width: 100%; border-radius: 6px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--panel);
              border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 14px; }
  .controls label { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  select, button { background: #333744; color: var(--fg); border: 1px solid #444858; border-radius: 6px; padding: 4px 9px; font: inherit; }
  button:hover, select:hover { border-color: var(--accent); }
  .detail { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .info { font: 12px ui-monospace, monospace; color: var(--muted); background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px; padding: 10px 14px; min-width: 220px; }
  .info table { border-collapse: collapse; }
  .info td { padding: 2px 10px 2px 0; vertical-align: top; }
  .info td:last-child { color: var(--fg); }
  .legend span { margin-right: 10px; }
  .strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .thumb { background: var(--card); border: 2px solid transparent; border-radius: 8px; padding: 4px; cursor: pointer; text-align: center;
           font-size: 11px; color: var(--muted); }
  .thumb.on { border-color: var(--accent); color: #fff; }
  .thumb .act { color: var(--hit); font-weight: 600; }
  .pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; }
  .pager a { color: var(--muted); } .pager a:hover { color: var(--fg); }
  .keys { color: var(--muted); font-size: 12px; margin-top: 10px; }
  kbd { background: #333744; border: 1px solid #444858; border-radius: 4px; padding: 0 4px; font: 11px ui-monospace, monospace; }
  .err { color: #ff8080; }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }
    nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    nav .anim { display: none; }
    main { padding: 16px; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"><p class="sub">loading sprites…</p></main>
</div>
<script>
// Single-page browser for every exported sprite. Routes (hash):
//   #/                     every character
//   #/<sprite>             every animation of one character
//   #/<sprite>/<anim>      one animation: big player, frame strip, boxes
//   #/<sprite>/<anim>/<i>  same, paused on frame i (0-based)
const $ = (id) => document.getElementById(id);
const REPEAT_PAUSE_MS = 500;   // gap before a one-shot animation restarts, so its start is visible
const sprites = {};            // name -> { name, data, img, anims: [{ key, name, from, to, loop, fps }] }
let order = [];
let players = [];
let detail = null;             // the big player on an animation page
const view = { zoom: 0, bg: 'check', origin: true, boxes: true, repeat: true, angle: 0, spin: false };

async function load() {
  let idx;
  try {
    idx = await (await fetch('../export/index.json', { cache: 'no-store' })).json();
  } catch {
    $('main').innerHTML = `<p class="err">Could not load <code>export/index.json</code>. Run <code>pixelforge export --all</code>,
      then <code>pixelforge serve</code> and open http://127.0.0.1:8000/</p>`;
    return;
  }
  order = idx.sprites;
  const bust = `?t=${Date.now()}`;
  await Promise.all(order.map(async (name) => {
    const data = await (await fetch(`../export/${name}.json${bust}`)).json();
    const img = new Image();
    img.src = `../export/${name}.png${bust}`;
    await img.decode();
    const pf = data.meta.pixelforge ?? {};
    const anims = data.meta.frameTags.map((t) => {
      const a = pf.animations?.[t.name] ?? {};
      return { key: t.name, name: a.anim ?? t.name.replace(`${name}_`, ''), from: t.from, to: t.to,
               loop: a.loop ?? true, fps: a.fps };
    });
    sprites[name] = { name, data, img, anims, pf, center: pf.anchor === 'center' };
  }));
  // old links: /viewer/?sprite=knight
  const legacy = new URLSearchParams(location.search).get('sprite');
  if (legacy && !location.hash) history.replaceState(null, '', `#/${legacy}`);
  route();
}

// ---------- drawing ----------
function frameOf(sp, i) { return sp.data.frames[String(i)]; }

function paint(canvas, sp, index, o) {
  const f = frameOf(sp, index), { w, h } = f.sourceSize, z = o.zoom;
  const rotated = sp.center && (o.angle || o.spin);
  const W = rotated ? Math.ceil(Math.hypot(w, h)) : w, H = rotated ? W : h;
  if (canvas.width !== W * z || canvas.height !== H * z) { canvas.width = W * z; canvas.height = H * z; }
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  if (o.bg === 'check') {
    const c = Math.max(z, 4);
    for (let y = 0; y < H * z; y += c) for (let x = 0; x < W * z; x += c) {
      ctx.fillStyle = ((x + y) / c) % 2 ? '#d6d6d6' : '#ececec';
      ctx.fillRect(x, y, c, c);
    }
  } else { ctx.fillStyle = o.bg; ctx.fillRect(0, 0, W * z, H * z); }
  const [ox, oy] = sp.pf.origin ?? [w / 2, h];
  ctx.save();
  if (rotated) {
    ctx.translate(W * z / 2, H * z / 2);
    ctx.rotate(o.angle);
    ctx.translate(-ox * z, -oy * z);
  }
  const r = f.frame;
  ctx.drawImage(sp.img, r.x, r.y, r.w, r.h, 0, 0, w * z, h * z);
  const lw = Math.max(1, Math.round(z / 4));
  const rect = (b, color, width, dash) => {
    ctx.setLineDash(dash ?? []);
    ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.strokeRect(b[0] * z + width / 2, b[1] * z + width / 2, b[2] * z - width, b[3] * z - width);
  };
  if (o.boxes) {
    const b = sp.pf.body;
    if (b) rect([b.x, b.y, b.w, b.h], '#fac828', lw, [lw * 3, lw * 2]);
    for (const u of f.pixelforge?.hurt ?? []) rect(u, '#28c85a', lw);
    for (const t of f.pixelforge?.hit ?? []) rect(t, '#f0283c', lw * 2);
  }
  if (o.origin) {
    ctx.setLineDash([]);
    ctx.strokeStyle = '#ff00c8'; ctx.lineWidth = Math.max(1, z / 4);
    ctx.beginPath();
    if (sp.center) {                       // rotation centre: a small cross
      ctx.moveTo((ox - 2) * z, oy * z); ctx.lineTo((ox + 2) * z, oy * z);
      ctx.moveTo(ox * z, (oy - 2) * z); ctx.lineTo(ox * z, (oy + 2) * z);
    } else {                               // feet: the ground line plus a tick
      ctx.moveTo(0, oy * z); ctx.lineTo(w * z, oy * z);
      ctx.moveTo(ox * z, (oy - 3) * z); ctx.lineTo(ox * z, oy * z);
    }
    ctx.stroke();
  }
  ctx.restore();
}

// ---------- playback ----------
class Player {
  constructor(canvas, sp, anim, opts) {
    Object.assign(this, { canvas, sp, anim, opts, frame: 0, acc: 0, playing: true, onframe: null });
  }
  get count() { return this.anim.to - this.anim.from + 1; }
  get repeats() { return this.anim.loop || this.opts.repeat; }
  hold(i) {
    const d = frameOf(this.sp, this.anim.from + i).duration;
    return d + (i === this.count - 1 && !this.anim.loop ? REPEAT_PAUSE_MS : 0);
  }
  advance(dt) {
    if (!this.playing) return;
    this.acc += dt;
    let changed = false;
    while (this.acc >= this.hold(this.frame)) {
      this.acc -= this.hold(this.frame);
      if (this.frame === this.count - 1 && !this.repeats) { this.acc = 0; break; }
      this.frame = (this.frame + 1) % this.count;
      changed = true;
    }
    if (changed) { this.draw(); this.onframe?.(); }
  }
  seek(i) { this.frame = (i + this.count) % this.count; this.acc = 0; this.draw(); this.onframe?.(); }
  draw() { paint(this.canvas, this.sp, this.anim.from + this.frame, this.opts); }
}

let last = 0;
function tick(t) {
  const dt = last ? Math.min(t - last, 250) : 0;
  last = t;
  if (view.spin && detail) { view.angle = (view.angle + dt * 0.0015) % (Math.PI * 2); detail.draw(); }
  for (const p of players) p.advance(dt);
  requestAnimationFrame(tick);
}

// ---------- pages ----------
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const href = (...parts) => '#/' + parts.map(encodeURIComponent).join('/');
const fitZoom = (sp, px) => Math.max(1, Math.floor(px / frameOf(sp, 0).sourceSize.w));
const idleOf = (sp) => sp.anims.find((a) => a.name === 'idle' || a.name === 'idle_down') ?? sp.anims[0];
const describe = (a) => `${a.to - a.from + 1} frames · ${a.fps ?? '–'} fps · ${a.loop ? 'loops' : 'plays once'}`;
const hasHits = (sp, a) => { for (let i = a.from; i <= a.to; i++) if (frameOf(sp, i).pixelforge?.hit?.length) return true; return false; };

function renderNav(spName, animName) {
  $('nav').innerHTML = `<a class="brand" href="#/">pixelforge sprites</a>` + order.map((n) => {
    const sp = sprites[n];
    const anims = n === spName || !spName ? sp.anims.map((a) =>
      `<a class="anim ${n === spName && a.name === animName ? 'on' : ''}" href="${href(n, a.name)}">${esc(a.name)}</a>`).join('') : '';
    return `<a class="sprite ${n === spName && !animName ? 'on' : ''}" href="${href(n)}">${esc(n)}</a>${anims}`;
  }).join('') + `<div class="tools"><a href="phaser.html">Phaser test (hits, rotation) ↗</a>
    <a href="tilemap.html">tilemap test (tilesets) ↗</a>
    <a href="../export/gallery.html">static gallery ↗</a></div>`;
}

function cardGrid(items) {
  // items: [{ link, sp, anim, title, meta }]
  const wrap = document.createElement('div');
  wrap.className = 'cards';
  for (const it of items) {
    const a = document.createElement('a');
    a.className = 'card'; a.href = it.link;
    const c = document.createElement('canvas');
    a.append(c);
    a.insertAdjacentHTML('beforeend', `<div class="name">${esc(it.title)}</div><div class="meta">${it.meta}</div>`);
    wrap.append(a);
    const p = new Player(c, it.sp, it.anim, { ...view, zoom: fitZoom(it.sp, 200), angle: 0, spin: false, repeat: true, boxes: false, origin: false });
    p.draw();
    players.push(p);
  }
  return wrap;
}

function homePage() {
  renderNav();
  $('main').innerHTML = `<h1>Characters</h1><p class="sub">${order.length} sprites. Pick one to see every animation.</p>`;
  $('main').append(cardGrid(order.map((n) => {
    const sp = sprites[n];
    return { link: href(n), sp, anim: idleOf(sp), title: n,
             meta: `${esc(sp.pf.class ?? 'custom')} · ${sp.anims.length} animations<br>${sp.anims.map((a) => esc(a.name)).join(', ')}` };
  })));
}

function spritePage(sp) {
  renderNav(sp.name);
  const f0 = frameOf(sp, 0).sourceSize;
  $('main').innerHTML = `<div class="crumbs"><a href="#/">Characters</a> /</div><h1>${esc(sp.name)}</h1>
    <p class="sub">class ${esc(sp.pf.class ?? 'custom')} · canvas ${f0.w}×${f0.h} · origin ${(sp.pf.origin ?? []).join(',')}
    ${sp.center ? '(rotation centre, drawn facing east)' : '(feet)'} · ${sp.anims.length} animations. Pick one to step through its frames.</p>`;
  $('main').append(cardGrid(sp.anims.map((a) => ({
    link: href(sp.name, a.name), sp, anim: a, title: a.name,
    meta: describe(a) + (hasHits(sp, a) ? ' · <span style="color:var(--hit)">attack</span>' : ''),
  }))));
}

function animPage(sp, anim, startFrame) {
  renderNav(sp.name, anim.name);
  const i = sp.anims.indexOf(anim);
  const prev = sp.anims[i - 1], next = sp.anims[i + 1];
  if (view.zoomFor !== sp.name) { view.zoom = fitZoom(sp, 520); view.zoomFor = sp.name; }
  const zooms = [2, 3, 4, 6, 8, 10, 12];
  if (!zooms.includes(view.zoom)) zooms.push(view.zoom), zooms.sort((a, b) => a - b);
  $('main').innerHTML = `
    <div class="crumbs"><a href="#/">Characters</a> / <a href="${href(sp.name)}">${esc(sp.name)}</a> /</div>
    <h1>${esc(anim.name)}</h1><p class="sub">${describe(anim)}</p>
    <div class="controls">
      <button id="play"></button><button id="prev" title="previous frame">◀</button><button id="next" title="next frame">▶</button>
      <label>zoom <select id="zoom">${zooms.map((z) => `<option ${z === view.zoom ? 'selected' : ''}>${z}</option>`).join('')}</select></label>
      <label>bg <select id="bg">${[['check', 'checker'], ['#2a2d36', 'dark'], ['#8fb8de', 'sky'], ['#5a8a3c', 'grass'], ['#ffffff', 'white']]
        .map(([v, t]) => `<option value="${v}" ${v === view.bg ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      ${sp.center ? `<label>facing <select id="angle">${['spin', 0, 45, 90, 135, 180, 225, 270, 315].map((d) =>
        `<option value="${d}" ${(view.spin ? d === 'spin' : d !== 'spin' && Math.round(view.angle * 180 / Math.PI) === d) ? 'selected' : ''}>${d === 'spin' ? 'spinning' : d + '°'}</option>`).join('')}</select></label>` : ''}
      <label><input type="checkbox" id="boxes" ${view.boxes ? 'checked' : ''}> boxes</label>
      <label><input type="checkbox" id="origin" ${view.origin ? 'checked' : ''}> origin</label>
      ${anim.loop ? '' : `<label title="Attacks play once in the game. Repeat them here with a short pause."><input type="checkbox" id="repeat" ${view.repeat ? 'checked' : ''}> repeat</label>`}
    </div>
    <div class="detail"><canvas id="stage"></canvas><div class="info" id="info"></div></div>
    <div class="strip" id="strip"></div>
    <div class="keys"><kbd>space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> step frames · <kbd>↑</kbd><kbd>↓</kbd> previous/next animation · click a frame to inspect it</div>
    <div class="pager"><span>${prev ? `<a href="${href(sp.name, prev.name)}">← ${esc(prev.name)}</a>` : ''}</span>
      <span>${next ? `<a href="${href(sp.name, next.name)}">${esc(next.name)} →</a>` : ''}</span></div>`;

  detail = new Player($('stage'), sp, anim, view);
  players.push(detail);
  const thumbs = [];
  for (let k = 0; k < detail.count; k++) {
    const f = frameOf(sp, anim.from + k);
    const t = document.createElement('div');
    t.className = 'thumb';
    const c = document.createElement('canvas');
    paint(c, sp, anim.from + k, { ...view, zoom: fitZoom(sp, 110), angle: 0, spin: false, boxes: false, origin: false });
    t.append(c);
    t.insertAdjacentHTML('beforeend', `<div>${k}${f.pixelforge?.hit?.length ? ' <span class="act">active</span>' : ''}</div><div>${f.duration}ms</div>`);
    t.onclick = () => { pause(); detail.seek(k); };
    $('strip').append(t);
    thumbs.push(t);
  }
  const playBtn = () => { $('play').textContent = detail.playing ? '❚❚ pause' : '► play'; };
  const pause = () => { detail.playing = false; playBtn(); };
  detail.onframe = () => {
    const f = frameOf(sp, anim.from + detail.frame);
    thumbs.forEach((t, k) => t.classList.toggle('on', k === detail.frame));
    const boxes = (list) => list?.length ? list.map((b) => `[${b.join(',')}]`).join('<br>') : '–';
    const b = sp.pf.body;
    $('info').innerHTML = `<table>
      <tr><td>frame</td><td>${detail.frame} of ${detail.count} (sheet #${anim.from + detail.frame})</td></tr>
      <tr><td>duration</td><td>${f.duration} ms</td></tr>
      <tr><td>active</td><td>${f.pixelforge?.hit?.length ? '<span style="color:var(--hit)">yes, deals damage</span>' : 'no'}</td></tr>
      <tr><td>body box</td><td>${b ? `[${b.x},${b.y},${b.w},${b.h}]` : '–'}</td></tr>
      <tr><td>hurtboxes</td><td>${boxes(f.pixelforge?.hurt)}</td></tr>
      <tr><td>hitboxes</td><td>${boxes(f.pixelforge?.hit)}</td></tr>
      <tr><td>in game</td><td>${anim.loop ? 'loops' : 'plays once'}</td></tr>
      <tr><td>Phaser key</td><td>${esc(anim.key)}</td></tr></table>
      <p class="legend"><span style="color:var(--body)">▬ body</span><span style="color:var(--hurt)">▬ hurt</span><span style="color:var(--hit)">▬ hit</span></p>`;
    if (!detail.playing) history.replaceState(null, '', href(sp.name, anim.name, detail.frame));
  };
  if (startFrame != null) { detail.playing = false; detail.seek(startFrame); } else detail.seek(0);
  playBtn();

  $('play').onclick = () => {
    detail.playing = !detail.playing;
    if (detail.playing && detail.frame === detail.count - 1 && !detail.repeats) detail.seek(0);
    if (detail.playing) history.replaceState(null, '', href(sp.name, anim.name));
    playBtn();
  };
  $('prev').onclick = () => { pause(); detail.seek(detail.frame - 1); };
  $('next').onclick = () => { pause(); detail.seek(detail.frame + 1); };
  $('zoom').onchange = (e) => { view.zoom = +e.target.value; detail.draw(); };
  $('bg').onchange = (e) => { view.bg = e.target.value; detail.draw(); };
  $('boxes').onchange = (e) => { view.boxes = e.target.checked; detail.draw(); };
  $('origin').onchange = (e) => { view.origin = e.target.checked; detail.draw(); };
  if ($('repeat')) $('repeat').onchange = (e) => { view.repeat = e.target.checked; };
  if ($('angle')) $('angle').onchange = (e) => {
    view.spin = e.target.value === 'spin';
    if (!view.spin) view.angle = +e.target.value * Math.PI / 180;
    detail.draw();
  };
  detail.keys = { prev, next };
}

function route() {
  players = []; detail = null;
  const [spName, animName, frame] = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  const sp = sprites[spName];
  const anim = sp?.anims.find((a) => a.name === animName);
  if (anim) animPage(sp, anim, frame != null ? +frame : null);
  else if (sp) spritePage(sp);
  else homePage();
  document.title = [animName && anim ? animName : null, sp ? spName : null, 'pixelforge sprites'].filter(Boolean).join(' · ');
}

addEventListener('hashchange', route);
addEventListener('keydown', (e) => {
  if (!detail || e.target.tagName === 'SELECT' || e.altKey || e.ctrlKey || e.metaKey) return;
  const go = (a) => a && (location.hash = href(detail.sp.name, a.name));
  if (e.key === ' ') { e.preventDefault(); $('play').click(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); $('prev').click(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); $('next').click(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); go(detail.keys.prev); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); go(detail.keys.next); }
});
load();
requestAnimationFrame(tick);
</script>
</body>
</html>
