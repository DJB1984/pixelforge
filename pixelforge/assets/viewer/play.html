<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixelforge play</title>
<style>
  body { margin: 0; background: #141518; color: #a3a6ad; font: 13px Inter, system-ui, sans-serif; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; }
  label { display: inline-flex; gap: 6px; align-items: center; }
  select { background: #1c1d21; color: #ededef; border: 1px solid rgba(255,255,255,.12); border-radius: 6px; padding: 3px 6px; font: inherit; }
  kbd { font: 11px ui-monospace, Consolas, monospace; color: #ededef; background: #1c1d21; border: 1px solid rgba(255,255,255,.12); border-radius: 4px; padding: 1px 5px; }
  #info { font: 12px ui-monospace, Consolas, monospace; color: #82858d; min-height: 1.4em; }
  .embed .pick { display: none; }
  #game { padding: 0 16px; }
  p { margin: 12px 16px; }
  code { color: #ededef; }
</style>
</head>
<body>
<div class="bar">
  <label class="pick">Level <select id="level"></select></label>
  <span id="help"></span>
  <label><input type="checkbox" id="boxes"> Boxes</label>
  <span id="info"></span>
</div>
<div id="game"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script type="module">
import { loadPixelforgeAll, createPixelforgeAll, pixelforgeLevel, addPixelforgeHud, drawPixelforgeBoxes,
         installPixelforgePlay } from '../phaser/pixelforge.js';

// Plays a level the way the game does (pixelforgeLevel + addPixelforgePlayer), from `pixelforge serve`'s
// live builds: edit levels/ or sprites/ and reload. Doors lead to their level. The HUD is pixelforge.json's.
const BASE = '../live/';
const params = new URLSearchParams(location.search);
if (params.has('embed')) document.body.classList.add('embed');
const $ = (id) => document.getElementById(id);
const [index, project] = await Promise.all([
  fetch(`${BASE}index.json`, { cache: 'no-store' }).then((r) => r.json()),
  fetch('/pixelforge.json', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : {})).catch(() => ({})),
]);
const levels = index.levels ?? [];
const first = levels.includes(params.get('level')) ? params.get('level') : levels[0];
$('level').innerHTML = levels.map((n) => `<option ${n === first ? 'selected' : ''}>${n}</option>`).join('');
$('level').onchange = () => { params.set('level', $('level').value); location.search = params; };
const [RW, RH] = project.resolution ?? [320, 180];
// embedded in the dashboard: the biggest whole zoom that fits the frame (never more than the game's)
const ZOOM = params.has('embed')
  ? Math.max(1, Math.min(project.zoom ?? 3, Math.floor((innerWidth - 32) / RW), Math.floor((innerHeight - 48) / RH)))
  : project.zoom ?? 3;
const HELP = {
  side: '<kbd>←</kbd><kbd>→</kbd> walk · hold <kbd>Shift</kbd> run · <kbd>Space</kbd> jump · <kbd>X</kbd> attack',
  topdown: '<kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or WASD walk · <kbd>X</kbd> attack',
  overhead: '<kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or WASD move · <kbd>X</kbd> attack',
};

class PlayScene extends Phaser.Scene {
  constructor() { super('play'); }
  init(data) { this.levelName = data?.level ?? first; this.spawn = data?.spawn; }
  preload() { loadPixelforgeAll(this, BASE); }
  create() {
    createPixelforgeAll(this);
    this.level = pixelforgeLevel(this, this.levelName, { spawn: this.spawn });
    window.pixelforgeHud = addPixelforgeHud(this);   // pixelforge.json "hud", in its own scene
    installPixelforgePlay(this, this.level);         // window.pixelforgePlay, for `pixelforge play`
    $('help').innerHTML = HELP[this.level.info.view] ?? '';
    const onTrigger = (o) => {
      if (o.type === 'door' && o.to && levels.includes(o.to) && !params.has('test')) {
        this.time.delayedCall(0, () => this.scene.restart({ level: o.to, spawn: o.spawn }));
      }
    };
    this.events.on('pixelforge-trigger', onTrigger);
    this.events.once('shutdown', () => this.events.off('pixelforge-trigger', onTrigger));
    this.debug = this.add.graphics().setDepth(2e5);
  }
  update() {
    const p = this.level?.player;
    this.debug.clear();
    if (!p) return;
    if ($('boxes').checked) {
      this.debug.lineStyle(1, 0xfac828, 1).strokeRectShape(p.body);
      drawPixelforgeBoxes(this.debug, [p, ...this.level.sprites]);
      for (const s of this.level.props) if (s.body) this.debug.lineStyle(1, 0xf0283c, 1).strokeRect(s.body.x, s.body.y, s.body.width, s.body.height);
      for (const o of this.level.triggers) this.debug.lineStyle(1, 0x2ce8f5, 1).strokeRect(...o.rect);
    }
    $('info').textContent = `${this.levelName}  ·  ${p.anims.currentAnim?.key ?? ''}  ·  (${Math.round(p.x)}, ${Math.round(p.y)})`;
  }
}

if (!first) {
  document.body.insertAdjacentHTML('beforeend', '<p>No levels yet. Make one with <code>pixelforge new-level start</code>.</p>');
} else {
  window.pixelforgeGame = new Phaser.Game({
    type: Phaser.AUTO, parent: 'game', pixelArt: true, backgroundColor: '#141518',
    width: RW, height: RH, zoom: ZOOM, physics: { default: 'arcade' }, scene: PlayScene,
  });
}
</script>
</body>
</html>
