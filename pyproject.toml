[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelforge"
version = "0.2.0"
description = "Text-grid pixel art + animation toolkit for AI authoring, exporting to Phaser"
requires-python = ">=3.10"
dependencies = ["pillow>=10.1"]

[project.scripts]
pixelforge = "pixelforge.__main__:main"

[tool.setuptools]
packages = ["pixelforge"]

[tool.setuptools.package-data]
pixelforge = ["assets/*", "assets/**/*"]
